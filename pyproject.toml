[build-system]
requires = [ "setuptools>=77.0.0", "wheel" ]
build-backend = "setuptools.build_meta"

[project]
name = "nld-core"
version = "0.1.2a0"
description = "Typed, YAML-defined data flows with built-in incremental processing across major SQL warehouses."
readme = "README.md"
requires-python = ">=3.12.0,<3.14"
license = "Apache-2.0"
license-files = [ "LICENSE.md" ]
authors = [ { name = "Nexus Lab" } ]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typing_extensions>=4.7.0,<5.0",
    "pyyaml>=6.0.0,<7.0",
    "pydantic>=2.0.0,<3.0",
    "click>=8.1.7,<9.0",
    "python-dotenv>=1.0.0,<2.0",
    "sqlglot>=26.0.0,<30.0",
    "strenum>=0.4.10,<0.5",
    "pandas>=2.1.3,<3.0",
    "jinja2>=3.1.3,<4.0",
    "isodate>=0.6.1,<1.0",
    "networkx>=3.4.1,<4.0",
    "requests>=2.32.0,<3.0",
]

[project.optional-dependencies]
azure_blob_storage = [ "azure-storage-blob>=12.24.0,<13.0" ]
bigquery = [ "google-cloud-bigquery>=3.0.0,<4.0", "google-auth>=2.0.0,<3.0" ]
duckdb = [ "duckdb>=1.0.0" ]
postgres = [ "psycopg2-binary>=2.9.9,<3.0" ]
pyarrow = [ "pyarrow>=15.0.0" ]
s3_blob_storage = [ "boto3>=1.35.0,<2.0", "mypy_boto3_s3" ]
snowflake = [ "snowflake-connector-python>=4.3.0,<5.0", "cryptography>=36.0.0" ]

[project.urls]
Homepage = "https://github.com/nexuslab-data/nld-core"
Source = "https://github.com/nexuslab-data/nld-core"
Issues = "https://github.com/nexuslab-data/nld-core/issues"

[project.scripts]
nld = "nld.cli.main:cli"

[tool.setuptools]
package-dir = { "" = "core" }

[tool.setuptools.packages.find]
where = [ "core" ]
include = [ "nld", "nld.*" ]
namespaces = true

[tool.setuptools.package-data]
nld = [ "py.typed" ]
