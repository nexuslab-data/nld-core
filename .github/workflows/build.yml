name: Build

# Verifies that the nld-core package builds and imports correctly.
# Runs on every push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build & smoke-test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: uv build

      - name: Check distribution metadata
        run: uv tool run twine check dist/*

      - name: Install the built wheel in a clean environment
        run: |
          uv venv /tmp/smoke --python ${{ matrix.python-version }}
          uv pip install --python /tmp/smoke dist/*.whl

      - name: Smoke test - import and CLI
        run: |
          /tmp/smoke/bin/python -c "import nld; print('import nld OK')"
          /tmp/smoke/bin/nld --help
